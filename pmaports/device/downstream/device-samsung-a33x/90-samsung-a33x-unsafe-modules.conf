# Known-unsafe modules for the current prebuilt A33/TWRP kernel.
#
# phy_exynos_mipi caused a repeatable BRK panic in exynos_mipi_phy_probe when
# udev autoloaded it from the postmarketOS initramfs. Keep these disabled until
# they are tested sequentially with a corrected kernel or a controlled TWRP
# first-stage environment.

blacklist phy_exynos_mipi
install phy_exynos_mipi /bin/false

blacklist phy_exynos_mipi_dsim
install phy_exynos_mipi_dsim /bin/false

blacklist exynos_drm
blacklist mcd_panel_samsung_drv
blacklist mcd_panel_samsung_helper
blacklist mcd_panel
blacklist fimc_is
